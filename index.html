<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concentrado de Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F3ED;
  --surface:#FFFFFF;
  --surface-2:#EDE7DA;
  --ink:#241F1A;
  --ink-dim:#726A5E;
  --ink-faint:#A69D8D;
  --line:#DED4C2;
  --line-strong:#C8BBA3;
  --accent:#1F5C57;
  --accent-ink:#F3F8F6;
  --accent-soft:#DDEBE8;
  --gold:#B4842A;
  --gold-soft:#F3E6CB;
  --danger:#A6392F;
  --danger-soft:#F3DCD8;
  --good:#3E7D4E;
  --good-soft:#DCEBDF;
  --shadow: 0 1px 2px rgba(36,31,26,.06), 0 8px 24px -12px rgba(36,31,26,.18);
  --dantes:#A6332D;
  --tacos:#B8871E;
  --inglesa:#9C5A72;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1815;
    --surface:#242019;
    --surface-2:#2E2921;
    --ink:#F3EEE4;
    --ink-dim:#B7AC98;
    --ink-faint:#7D7461;
    --line:#3B342A;
    --line-strong:#4C4335;
    --accent:#5FB3A6;
    --accent-ink:#0F1E1B;
    --accent-soft:#233A35;
    --gold:#E0B15A;
    --gold-soft:#3A2E17;
    --danger:#E38175;
    --danger-soft:#3A231F;
    --good:#7FC191;
    --good-soft:#1F3324;
    --dantes:#E0847E;
    --tacos:#E0BA6B;
    --inglesa:#D79BB2;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1815;
  --surface:#242019;
  --surface-2:#2E2921;
  --ink:#F3EEE4;
  --ink-dim:#B7AC98;
  --ink-faint:#7D7461;
  --line:#3B342A;
  --line-strong:#4C4335;
  --accent:#5FB3A6;
  --accent-ink:#0F1E1B;
  --accent-soft:#233A35;
  --gold:#E0B15A;
  --gold-soft:#3A2E17;
  --danger:#E38175;
  --danger-soft:#3A231F;
  --good:#7FC191;
  --good-soft:#1F3324;
  --dantes:#E0847E;
  --tacos:#E0BA6B;
  --inglesa:#D79BB2;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  font-size:14px; line-height:1.5;
}
h1,h2,h3{ font-family:'Zilla Slab', Georgia, serif; text-wrap:balance; margin:0; color:var(--ink); }
.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
a{ color:var(--accent); }
::selection{ background:var(--accent-soft); }

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand .mark{
  width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-family:'Zilla Slab',serif; font-weight:700; font-size:17px;
  flex:none;
}
.brand h1{ font-size:19px; font-weight:600; }
.brand .sub{ color:var(--ink-dim); font-size:12.5px; }
.topbar .spacer{ flex:1; }
.modeswitch{
  display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px;
}
.modeswitch button{
  border:none; background:transparent; color:var(--ink-dim); padding:7px 14px; border-radius:8px;
  font-size:13px; font-weight:600; cursor:pointer;
}
.modeswitch button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.identity-chip{
  display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:10px;
  padding:7px 12px; font-size:12.5px; color:var(--ink-dim);
}
.identity-chip strong{ color:var(--ink); font-weight:600; }
.identity-chip button{
  border:none; background:none; color:var(--accent); font-weight:600; cursor:pointer; font-size:12.5px; padding:0;
}
.wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }
.hint-banner{
  background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);
  color:var(--ink); border-radius:12px; padding:12px 16px; font-size:13px; margin-bottom:22px;
  display:flex; gap:10px; align-items:flex-start;
}
.hint-banner b{ color:var(--gold); }

/* ---------- onboarding ---------- */
.onboard-overlay{
  position:fixed; inset:0; background:rgba(20,17,13,.55); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.onboard-card{
  background:var(--surface); border-radius:18px; box-shadow:var(--shadow); width:100%; max-width:520px;
  padding:32px; border:1px solid var(--line);
}
.onboard-card h2{ font-size:23px; margin-bottom:6px; }
.onboard-card p.lead{ color:var(--ink-dim); font-size:13.5px; margin:0 0 22px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:6px; letter-spacing:.02em; text-transform:uppercase; }
.field select, .field input{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit;
}
.obs-block{ margin-top:16px; }
.obs-block label{ display:block; font-size:11px; font-weight:600; color:var(--ink-dim); margin-bottom:6px; letter-spacing:.02em; text-transform:uppercase; }
.obs-block textarea{
  width:100%; min-height:64px; padding:10px 12px; border-radius:9px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:13.5px; font-family:inherit; resize:vertical;
}
.obs-block textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.obs-note{
  background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius:10px;
  padding:9px 12px; font-size:12.5px; color:var(--ink); margin-top:8px;
}
.obs-note b{ color:var(--gold); display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;}
.field select:focus, .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.btn{
  border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
}
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.btn-ghost{ background:var(--surface-2); color:var(--ink); }
.btn-danger{ background:var(--danger-soft); color:var(--danger); }
.btn-block{ width:100%; justify-content:center; padding:12px; font-size:14px; }

/* ---------- cards / layout ---------- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; }
.grid2{ display:grid; grid-template-columns:1.1fr 1fr; gap:20px; align-items:start; }
@media (max-width:880px){ .grid2{ grid-template-columns:1fr; } }
.section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.section-title h2{ font-size:18px; }
.section-title .meta{ font-size:12px; color:var(--ink-faint); }

.formrow{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.formrow.three{ grid-template-columns:1fr 90px 1fr; }
@media (max-width:560px){ .formrow, .formrow.three{ grid-template-columns:1fr; } }

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px;
  font-size:11.5px; font-weight:600; letter-spacing:.01em;
}
.chip-empresa-dantes{ background:color-mix(in srgb, var(--dantes) 16%, transparent); color:var(--dantes); }
.chip-empresa-tacos{ background:color-mix(in srgb, var(--tacos) 20%, transparent); color:var(--tacos); }
.chip-empresa-inglesa{ background:color-mix(in srgb, var(--inglesa) 18%, transparent); color:var(--inglesa); }
.chip-borrador{ background:var(--surface-2); color:var(--ink-dim); }
.chip-enviada{ background:var(--gold-soft); color:var(--gold); }
.chip-concentrado{ background:var(--good-soft); color:var(--good); }
.chip-pendiente-compra{ background:var(--gold-soft); color:var(--gold); }
.chip-comprado{ background:var(--good-soft); color:var(--good); }
tr.linea-comprada td{ opacity:.5; }
tr.linea-comprada .prod-nombre{ text-decoration:line-through; }
.linea-checkbox{ width:18px; height:18px; cursor:pointer; }

.ticket{
  border:1px dashed var(--line-strong); border-radius:12px; padding:16px; background:var(--surface-2);
}
.ticket-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
.ticket-head .who{ font-family:'Zilla Slab',serif; font-size:17px; font-weight:600; }
.ticket-head .when{ font-size:11.5px; color:var(--ink-faint); }
.itemline{
  display:grid; grid-template-columns:1fr 70px 90px 1fr 32px; gap:8px; align-items:center;
  padding:8px 0; border-bottom:1px solid var(--line);
}
.itemline:last-child{ border-bottom:none; }
.itemline .name{ font-size:13.5px; }
.itemline .name .rubro{ display:block; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; }
.itemline input[type=number]{
  width:100%; padding:6px 8px; border-radius:7px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-family:'IBM Plex Mono',monospace; text-align:right;
}
.itemline select{ width:100%; padding:6px 8px; border-radius:7px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:12.5px;}
.itemline .unit{ font-size:12px; color:var(--ink-dim); }
.itemline .del{ border:none; background:none; color:var(--danger); cursor:pointer; font-size:16px; line-height:1; padding:4px;}
.empty-note{ color:var(--ink-faint); font-size:13px; padding:18px 4px; text-align:center; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line-strong); font-weight:600;}
td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr.reqrow{ cursor:pointer; }
tr.reqrow:hover td{ background:var(--surface-2); }
tr.reqrow.selected td{ background:var(--accent-soft); }
.tablewrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); }
.tablewrap table{ min-width:640px; }

.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
.toolbar select, .toolbar input[type=search]{
  padding:8px 11px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13px;
}
.badgecount{
  background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:700; border-radius:100px;
  padding:1px 7px; margin-left:6px;
}

.drawer-backdrop{ position:fixed; inset:0; background:rgba(20,17,13,.45); z-index:90; }
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(440px,92vw); background:var(--surface);
  box-shadow:-16px 0 40px -20px rgba(0,0,0,.4); z-index:91; padding:24px; overflow-y:auto;
  border-left:1px solid var(--line);
}
.drawer h3{ font-size:18px; margin-bottom:2px; }
.drawer .close{ position:absolute; top:20px; right:20px; border:none; background:var(--surface-2); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; color:var(--ink-dim);}

.groupblock{ border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
.groupblock > summary{
  list-style:none; cursor:pointer; padding:12px 16px; background:var(--surface-2); display:flex; justify-content:space-between; align-items:center; font-weight:600;
}
.groupblock > summary::-webkit-details-marker{ display:none; }
.groupblock > summary .n{ font-weight:400; color:var(--ink-dim); font-size:12.5px;}
.subgroup{ padding:6px 16px 14px; }
.subgroup h4{ font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin:14px 0 6px; }

.tabbar{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; }
.tabbar button{
  border:none; background:none; padding:10px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabbar button.active{ color:var(--accent); border-bottom-color:var(--accent); }

.catalog-admin-row{ display:grid; grid-template-columns:1.3fr 1fr 70px 1fr 32px; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); align-items:center; font-size:13px;}
.catalog-admin-row.head{ font-size:11px; text-transform:uppercase; color:var(--ink-faint); font-weight:600; letter-spacing:.03em;}
.catalog-admin-row input, .catalog-admin-row select{ width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:12.5px;}

.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:20px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.stat .num{ font-family:'Zilla Slab',serif; font-size:26px; font-weight:600; }
.stat .lbl{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:11px 18px; border-radius:10px; font-size:13px; z-index:200; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>

<script>
/* =====================================================================
   CONEXIÓN A FIREBASE (Corporativo Dantes / Tacos de Anda — portal-compras)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDDwtJ14a5zHUKTkaJU1556X0eCIfClcsU",
  authDomain: "portal-compras-70cc2.firebaseapp.com",
  projectId: "portal-compras-70cc2",
  storageBucket: "portal-compras-70cc2.firebasestorage.app",
  messagingSenderId: "279525925822",
  appId: "1:279525925822:web:9b1735b7f545389f690fef"
};
firebase.initializeApp(firebaseConfig);
const firestoreDb = firebase.firestore();

/* =====================================================================
   ACCESO A LA VISTA DE COMPRAS
   Solo Elizabeth (compras corporativo) debe poder entrar a "Soy compras".
   El link normal del mockup NO muestra ese botón. Para dárselo acceso,
   comparte este mismo link pero agregando al final: #acceso=CLAVE_COMPRAS
   (una sola vez, en el navegador/dispositivo que use ella normalmente —
   después de eso el acceso se recuerda ahí y ya no hace falta escribirlo).
   Usamos el "#" (y no "?") porque el "?" se puede perder al publicar/compartir
   el link de este mockup; el "#" siempre lo respeta el navegador.
   Para cambiar la clave, edita COMPRAS_ACCESS_TOKEN abajo y publica de nuevo.
   ===================================================================== */
const COMPRAS_ACCESS_TOKEN = 'elizabeth-compras-2026';
const COMPRAS_ACCESS_KEY = 'concentrado_acceso_compras';
let COMPRAS_ACCESS_ENABLED = false;

function habilitarAccesoComprasSiAplica(){
  let habilitado = false;
  try{
    // Buscamos el token tanto en el "hash" (#acceso=...) como en la query (?acceso=...)
    // por si el link se comparte de una forma u otra.
    const hash = window.location.hash || '';
    const hashMatch = hash.match(/[#&]acceso=([^&]+)/);
    const tokenDeHash = hashMatch ? decodeURIComponent(hashMatch[1]) : null;
    const params = new URLSearchParams(window.location.search);
    const tokenDeQuery = params.get('acceso');
    const token = tokenDeHash || tokenDeQuery;
    if(token === COMPRAS_ACCESS_TOKEN){
      localStorage.setItem(COMPRAS_ACCESS_KEY, '1');
      habilitado = true;
    } else {
      habilitado = localStorage.getItem(COMPRAS_ACCESS_KEY) === '1';
    }
  }catch(e){ habilitado = false; }
  if(habilitado){
    const btn = document.querySelector('#modeSwitch button[data-mode="compras"]');
    if(btn) btn.hidden = false;
  }
  COMPRAS_ACCESS_ENABLED = habilitado;
  return habilitado;
}

/* =====================================================================
   DATA: áreas de captura + catálogos reales (extraídos de tus archivos)
   ===================================================================== */

const EMPRESAS = {
  dantes:  { label:"Dante's", cls:"chip-empresa-dantes" },
  tacos:   { label:"Tacos de Anda", cls:"chip-empresa-tacos" },
  inglesa: { label:"La Inglesa", cls:"chip-empresa-inglesa" },
};

// Cada "área" es una combinación empresa+sucursal+puesto que comparte un catálogo (catalogRef).
const AREAS = [
  { id:"tacos-produccion", empresa:"tacos", sucursal:"Sucursal única", puesto:"Encargado de producción", catalogRef:"tacos" },
  { id:"tacos-cocina",     empresa:"tacos", sucursal:"Sucursal única", puesto:"Encargado de cocina",      catalogRef:"tacos" },
  { id:"dantes-centro-barra",  empresa:"dantes", sucursal:"Centro",     puesto:"Encargado de barra",  catalogRef:"dantes-barra" },
  { id:"dantes-centro-cocina", empresa:"dantes", sucursal:"Centro",     puesto:"Encargado de cocina", catalogRef:"dantes-cocina" },
  { id:"dantes-blvd-barra",    empresa:"dantes", sucursal:"Boulevard",  puesto:"Encargado de barra",  catalogRef:"dantes-barra" },
  { id:"dantes-blvd-cocina",   empresa:"dantes", sucursal:"Boulevard",  puesto:"Encargado de cocina", catalogRef:"dantes-cocina" },
  { id:"dantes-centro-piso",   empresa:"dantes", sucursal:"Centro",     puesto:"Encargado de piso",   catalogRef:"dantes-piso" },
  { id:"dantes-blvd-piso",     empresa:"dantes", sucursal:"Boulevard",  puesto:"Encargado de piso",   catalogRef:"dantes-piso" },
  { id:"dantes-salsas",        empresa:"dantes", sucursal:"Producción central", puesto:"Chef", catalogRef:"dantes-salsas" },
  { id:"inglesa-operativa", empresa:"inglesa", sucursal:"Cafetería · Morelia", puesto:"Encargada operativa", catalogRef:"inglesa" },
];

function seedCatalog(rows){
  return rows.map((r,i)=>({ id:"p"+i+"_"+Math.random().toString(36).slice(2,7), rubro:r[0], nombre:r[1], unidad:r[2], proveedor:r[3]||"" }));
}

const CATALOGS_SEED = {
  "tacos": seedCatalog([
    ["Desechables","Ramikines","pz",""],["Desechables","Tapas de ramikin","pz",""],["Desechables","Vasos","pz",""],
    ["Desechables","Tapas de vaso","pz",""],["Desechables","Platos grandes","pz",""],["Desechables","Platos chicos","pz",""],
    ["Desechables","Servilletas","paq",""],["Desechables","Bolsa de asa","paq",""],
    ["Limpieza","Sanitas","pz",""],["Limpieza","Rollos de papel","pz",""],["Limpieza","Bolsas de basura","caja",""],

/* =====================================================================
   STORE: capa db (compartida, multiusuario) con respaldo local si no
   hay capability disponible (por ejemplo al revisar el mockup sin publicar)
   ===================================================================== */

const Store = (function(){
  let db = null, downloads = null, ready = false;
  const listeners = { catalog:{}, req:{}, allReqs:[], concentrados:[] };
  const local = { catalogs:null, reqs:{}, concentrados:{} };

  function loadLocal(){
    try{
      const raw = localStorage.getItem('concentrado_mock_v1');
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }
  function saveLocal(){
    try{ localStorage.setItem('concentrado_mock_v1', JSON.stringify(local)); }catch(e){}
  }

  async function init(){
    try{
      db = firestoreDb;
    }catch(e){}
    ready = true;
    if(!db){
      const saved = loadLocal();
      local.catalogs = (saved && saved.catalogs) || JSON.parse(JSON.stringify(CATALOGS_SEED));
      local.reqs = (saved && saved.reqs) || {};
      local.concentrados = (saved && saved.concentrados) || {};
      saveLocal();
    }
    return { hasDb: !!db, hasDownloads: !!downloads };
  }

  function emitLocalCatalog(ref){
    (listeners.catalog[ref]||[]).forEach(fn=>fn(local.catalogs[ref]||[]));
  }
  function emitLocalReq(id){
    (listeners.req[id]||[]).forEach(fn=>fn(local.reqs[id]||null));
  }
  function emitLocalAll(){
    const all = Object.values(local.reqs);
    listeners.allReqs.forEach(fn=>fn(all));
  }
  function emitLocalConcentrados(){
    const all = Object.values(local.concentrados);
    listeners.concentrados.forEach(fn=>fn(all));
  }

  return {
    init,
    get hasDb(){ return !!db; },

    watchCatalog(ref, cb){
      if(db){
        return db.collection('catalogo').doc(ref).onSnapshot(snap=>{
          const data = snap.exists ? snap.data() : null;
          cb((data && data.productos) || CATALOGS_SEED[ref] || []);
        }, ()=>cb(CATALOGS_SEED[ref]||[]));
      } else {
        listeners.catalog[ref] = listeners.catalog[ref]||[];
        listeners.catalog[ref].push(cb);
        cb(local.catalogs[ref]||[]);
        return ()=>{ listeners.catalog[ref] = listeners.catalog[ref].filter(f=>f!==cb); };
      }
    },

    async saveCatalog(ref, productos){
      if(db){
        await db.doc('catalogo/'+ref).set({ productos, actualizado: new Date().toISOString() });
      } else {
        local.catalogs[ref] = productos; saveLocal(); emitLocalCatalog(ref);
      }
    },

    watchRequisicion(id, cb){
      if(db){
        return db.doc('requisiciones/'+id).onSnapshot(snap=>{
          cb(snap.exists ? Object.assign({id:snap.id}, snap.data()) : null);
        }, ()=>cb(null));
      } else {
        listeners.req[id] = listeners.req[id]||[];
        listeners.req[id].push(cb);
        cb(local.reqs[id]||null);
        return ()=>{ listeners.req[id] = listeners.req[id].filter(f=>f!==cb); };
      }
    },

    async saveRequisicion(id, data){
      if(db){
        await db.doc('requisiciones/'+id).set(data);
      } else {
        local.reqs[id] = Object.assign({id}, data); saveLocal(); emitLocalReq(id); emitLocalAll();
      }
    },

    watchAllRequisiciones(cb){
      if(db){
        return db.collection('requisiciones').orderBy('creadoEn','desc').limit(500).onSnapshot(snap=>{
          cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data())));
        }, ()=>cb([]));
      } else {
        listeners.allReqs.push(cb);
        cb(Object.values(local.reqs));
        return ()=>{ const i=listeners.allReqs.indexOf(cb); if(i>=0) listeners.allReqs.splice(i,1); };
      }
    },

    async createConcentrado(data){
      const id = 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      if(db){
        await db.doc('concentrados/'+id).set(data);
      } else {
        local.concentrados[id] = Object.assign({id}, data); saveLocal(); emitLocalConcentrados();
      }
      return id;
    },

    watchConcentrados(cb){
      if(db){
        return db.collection('concentrados').orderBy('creadoEn','desc').limit(100).onSnapshot(snap=>{
          cb(snap.docs.map(d=>Object.assign({id:d.id}, d.data())));
        }, ()=>cb([]));
      } else {
        listeners.concentrados.push(cb);
        cb(Object.values(local.concentrados));
        return ()=>{ const i=listeners.concentrados.indexOf(cb); if(i>=0) listeners.concentrados.splice(i,1); };
      }
    },

    async updateConcentrado(id, data){
      if(db){
        await db.doc('concentrados/'+id).set(data);
      } else {
        local.concentrados[id] = Object.assign({id}, data); saveLocal(); emitLocalConcentrados();
      }
    },

    async saveFile(filename, blobOrArrayBuffer){
      const blob = blobOrArrayBuffer instanceof Blob ? blobOrArrayBuffer : new Blob([blobOrArrayBuffer]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
    },
  };
})();

   ===================================================================== */

function el(tag, attrs, children){
  const e = document.createElement(tag);
  attrs = attrs||{};
  Object.keys(attrs).forEach(k=>{
    if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==='class') e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(c=> e.appendChild(typeof c==='string' ? document.createTextNode(c) : c));
  return e;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}
function todayKey(){
  const d = new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function inicioSemana(d){ // lunes de la semana de d, a medianoche
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = (x.getDay()+6)%7; // 0=lunes
  x.setDate(x.getDate()-dow);
  return x;
}
function enPeriodo(iso, periodo, fechaRefStr){
  if(periodo==='todos') return true;
  if(!iso) return false;
  const d = new Date(iso);
  if(isNaN(d)) return false;
  const ref = new Date(fechaRefStr+'T00:00:00');
  if(periodo==='dia'){
    return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth() && d.getDate()===ref.getDate();
  }
  if(periodo==='semana'){
    const iniD = inicioSemana(d), iniRef = inicioSemana(ref);
    return iniD.getTime()===iniRef.getTime();
  }
  if(periodo==='mes'){
    return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth();
  }
  return true;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function renderOnboard(){

  try{ saved = savedRaw ? JSON.parse(savedRaw) : null; }catch(e){}
  if(saved && saved.areaId && saved.responsable && State.identity===null && !State.forceOnboard){
    State.identity = saved;
    startIdentity();
    return;
  }
  if(State.identity && !State.forceOnboard) return;

  const empresaSel = el('select',{id:'obEmpresa'});
  empresaSel.appendChild(el('option',{value:''},['Selecciona una empresa']));
  Object.keys(EMPRESAS).forEach(k=> empresaSel.appendChild(el('option',{value:k},[EMPRESAS[k].label])));

  const puestoSel = el('select',{id:'obPuesto', disabled:'disabled'});

  const continueBtn = el('button',{class:'btn btn-primary btn-block', disabled:'disabled'},['Continuar →']);

  function refreshSucursales(){
    const emp = empresaSel.value;
    sucursalSel.innerHTML = '';
    puestoSel.innerHTML = '';
    puestoSel.disabled = true; nombreInput.disabled = true; continueBtn.disabled = true;
    if(!emp){ sucursalSel.disabled = true; return; }
    const sucursales = [...new Set(AREAS.filter(a=>a.empresa===emp).map(a=>a.sucursal))];
    sucursalSel.appendChild(el('option',{value:''},['Selecciona']));
    sucursales.forEach(s=> sucursalSel.appendChild(el('option',{value:s},[s])));
    sucursalSel.disabled = false;
  }
  function refreshPuestos(){
    const emp = empresaSel.value, suc = sucursalSel.value;
    puestoSel.innerHTML = '';
    nombreInput.disabled = true; continueBtn.disabled = true;
    if(!suc){ puestoSel.disabled = true; return; }
    const puestos = AREAS.filter(a=>a.empresa===emp && a.sucursal===suc);
    puestoSel.appendChild(el('option',{value:''},['Selecciona']));
    puestos.forEach(a=> puestoSel.appendChild(el('option',{value:a.id},[a.puesto])));
    puestoSel.disabled = false;
  }
  function refreshContinue(){
    nombreInput.disabled = !puestoSel.value;
    continueBtn.disabled = !(puestoSel.value && nombreInput.value.trim().length>1);
  }
  empresaSel.addEventListener('change', refreshSucursales);
  sucursalSel.addEventListener('change', refreshPuestos);
  puestoSel.addEventListener('change', refreshContinue);
  nombreInput.addEventListener('input', refreshContinue);

  continueBtn.addEventListener('click', ()=>{
    const identity = { areaId: puestoSel.value, responsable: nombreInput.value.trim() };
    localStorage.setItem('concentrado_identity', JSON.stringify(identity));
    State.identity = identity;
    State.forceOnboard = false;
    root.innerHTML = '';
    startIdentity();
  });

  const cancelBtn = el('button',{class:'btn btn-ghost btn-block', style:'margin-top:8px;'},['Cancelar']);
  cancelBtn.addEventListener('click', ()=>{
    State.forceOnboard = false;
    root.innerHTML = '';

  });

  const cardChildren = [
    el('h2',{},['¿Quién eres hoy?']),

function startIdentity(){
  const area = areaById(State.identity.areaId);
  if(!area){ localStorage.removeItem('concentrado_identity'); State.identity=null; renderOnboard(); return; }
  updateIdentityChip();
  if(State.unsubCatalog) State.unsubCatalog();
  State.unsubCatalog = Store.watchCatalog(area.catalogRef, (productos)=>{
    State.catalog = productos;
    if(State.mode==='encargado') renderEncargado();
  });
  const reqId = 'req_'+area.id+'_'+slug(State.identity.responsable)+'_'+todayKey();
  State.currentReqId = reqId;
  if(State.unsubReq) State.unsubReq();
  State.unsubReq = Store.watchRequisicion(reqId, (data)=>{
    if(!data){
      data = {
        empresa: area.empresa, sucursal: area.sucursal, puesto: area.puesto, areaId: area.id,
        responsable: State.identity.responsable, items: [], observaciones: '', estado: 'borrador',
        creadoEn: null, enviadaEn: null, actualizadoEn: null, concentradoId: null,
      };
    }
    State.currentReq = data;
    if(State.mode==='encargado') renderEncargado();
  });
  // Historial de pedidos de esta misma sucursal/puesto (no importa quién lo haya escrito ese día)
  if(State.unsubMisHistorialReqs) State.unsubMisHistorialReqs();
  State.unsubMisHistorialReqs = Store.watchAllRequisiciones((all)=>{
    State.misHistorial = all.filter(r=> r.areaId===area.id && r.estado!=='borrador');
    if(State.mode==='encargado') renderEncargado();
  });
  if(State.unsubMisHistorialConcentrados) State.unsubMisHistorialConcentrados();
  State.unsubMisHistorialConcentrados = Store.watchConcentrados((all)=>{
    State.concentradosParaHistorial = all;
    if(State.mode==='encargado') renderEncargado();
  });
  renderEncargado();
}

        const v = parseFloat(qtyInput.value); if(!v||v<=0){ toast('Cantidad inválida.'); qtyInput.value=item.cantidad; return; }
        const items = req.items.map(x=> x.id===item.id ? Object.assign({},x,{cantidad:v}) : x);
        await persistReq({ items });
      });
      const provSel2 = el('select',{},[]);
      provSel2.appendChild(el('option',{value:''},['Sin especificar']));
      proveedores.forEach(p=> provSel2.appendChild(el('option',{value:p}, [p])));
      if(item.proveedor && !proveedores.includes(item.proveedor)) provSel2.appendChild(el('option',{value:item.proveedor},[item.proveedor]));
      provSel2.value = item.proveedor||'';
      provSel2.addEventListener('change', async ()=>{
        const items = req.items.map(x=> x.id===item.id ? Object.assign({},x,{proveedor:provSel2.value}) : x);
        await persistReq({ items });
      });
      const delBtn = el('button',{class:'del', title:'Eliminar'},['✕']);
      delBtn.addEventListener('click', async ()=>{
        const items = req.items.filter(x=>x.id!==item.id);
        await persistReq({ items });
        toast('Producto eliminado.');
      });
      const row = el('div',{class:'itemline'},[
        el('div',{class:'name'},[item.producto, el('span',{class:'rubro'},[item.rubro])]),

        el('div',{class:'unit'},[item.unidad]),

        delBtn,

      itemsWrap.appendChild(row);
    });
  }

  const obsTextarea = el('textarea',{placeholder:'Ej. "Urge la cerveza para el viernes", "el proveedor de siempre no tiene mostaza, buscar otra marca"…'},[]);
  obsTextarea.value = req.observaciones || '';
  if(locked) obsTextarea.disabled = true;
  obsTextarea.addEventListener('change', async ()=>{
    await persistReq({ observaciones: obsTextarea.value });
    toast('Observación guardada.');
  });
  const obsBlock = el('div',{class:'obs-block'},[
    el('label',{},['Observaciones generales de esta requisición (opcional)']),

  ]);

  const sendBtn = el('button',{class:'btn btn-primary', style:'margin-top:14px;'},[req.estado==='borrador' ? 'Enviar requisición a compras' : 'Actualizar requisición enviada']);

  sendBtn.addEventListener('click', async ()=>{
    const patch = { estado:'enviada', actualizadoEn: new Date().toISOString() };
    if(!req.enviadaEn) patch.enviadaEn = new Date().toISOString();

    el('div',{class:'section-title'},[el('h2',{},['Mi requisición de hoy']), el('span',{class:'meta'},[(req.items||[]).length+' producto(s)'])]),

function estadoPedidoLabel(r){
  if(r.estado==='enviada') return { text:'Enviada, pendiente de concentrar', cls:'chip-enviada' };
  if(r.estado==='en_concentrado'){
    const c = (State.concentradosParaHistorial||[]).find(x=>x.id===r.concentradoId);
    if(c && c.estadoCompra==='comprado') return { text:'✔ Comprado', cls:'chip-comprado' };
    return { text:'En concentrado · comprando', cls:'chip-pendiente-compra' };
  }
  return { text:r.estado, cls:'chip-borrador' };
}

async function persistReq(patch){
  const merged = Object.assign({}, State.currentReq, patch);
  if(!merged.creadoEn) merged.creadoEn = new Date().toISOString();
  merged.actualizadoEn = new Date().toISOString();
  State.currentReq = merged;
  await Store.saveRequisicion(State.currentReqId, merged);
}

function startCompras(){
  if(State.unsubAll) State.unsubAll();
  State.unsubAll = Store.watchAllRequisiciones((all)=>{
    State.allReqs = all.filter(r=> r.items && r.items.length>0 && r.estado!=='borrador');
    if(State.mode==='compras') renderCompras();
  });
  if(State.unsubConcentrados) State.unsubConcentrados();
  State.unsubConcentrados = Store.watchConcentrados((all)=>{
    State.concentrados = all.slice().sort((a,b)=> (b.creadoEn||'').localeCompare(a.creadoEn||''));
    if(State.mode==='compras') renderCompras();
  });
  renderCompras();
}

  const root = document.getElementById('viewCompras');

    const b = el('button',{class: (State.comprasTab||'dashboard')===id?'active':''},[label]);

    tabbar.appendChild(b);

  const estadoFilter = el('select',{},[
    el('option',{value:'enviada'},['Pendientes de concentrar']),

    el('option',{value:'todos'},['Todas las fechas']),
    el('option',{value:'dia'},['Un día']),
    el('option',{value:'semana'},['Una semana']),
    el('option',{value:'mes'},['Un mes']),
  ]);

  const fechaRefInput = el('input',{type:'date'});
  fechaRefInput.value = State.comprasFechaRef;
  fechaRefInput.hidden = State.comprasPeriodo==='todos';
  periodoFilter.addEventListener('change', ()=>{ State.comprasPeriodo = periodoFilter.value; renderCompras(); });
  fechaRefInput.addEventListener('change', ()=>{ State.comprasFechaRef = fechaRefInput.value; renderCompras(); });

  const genBtn = el('button',{class:'btn btn-primary'},['Generar concentrado', el('span',{class:'badgecount'},[String(State.comprasSeleccion.size)])]);

    if(State.comprasFiltroEmpresa!=='todas' && r.empresa!==State.comprasFiltroEmpresa) return false;
    if(State.comprasFiltroEstado!=='todas' && r.estado!==State.comprasFiltroEstado) return false;

async function generarConcentrado(){
  const ids = [...State.comprasSeleccion];
  const seleccionadas = State.allReqs.filter(r=> ids.includes(r.id));
  if(seleccionadas.length===0) return;
  const snapshot = seleccionadas.map(r=>({ id:r.id, empresa:r.empresa, sucursal:r.sucursal, puesto:r.puesto, responsable:r.responsable, items:r.items, observaciones:r.observaciones||'' }));
  const data = { creadoEn: new Date().toISOString(), generadoPor: State.identity? State.identity.responsable : 'Compras', requisicionIds: ids, snapshot, estadoCompra:'pendiente', comprados:{} };
  const concentradoId = await Store.createConcentrado(data);
  for(const r of seleccionadas){
    await Store.saveRequisicion(r.id, Object.assign({}, r, { estado:'en_concentrado', concentradoId, actualizadoEn:new Date().toISOString() }));
  }
  State.comprasSeleccion.clear();
  State.concentradoAbiertoId = concentradoId;
  toast('Concentrado generado con '+seleccionadas.length+' requisición(es).');
  renderCompras();
}

async function quitarDeConcentrado(c, reqId){
  const req = State.allReqs.find(r=>r.id===reqId);
  const nuevoSnapshot = (c.snapshot||[]).filter(x=>x.id!==reqId);
  const nuevosIds = (c.requisicionIds||[]).filter(id=>id!==reqId);
  await Store.updateConcentrado(c.id, Object.assign({}, c, { snapshot:nuevoSnapshot, requisicionIds:nuevosIds }));
  if(req){
    await Store.saveRequisicion(reqId, Object.assign({}, req, { estado:'enviada', concentradoId:null, actualizadoEn:new Date().toISOString() }));
  }
  toast('Requisición quitada del concentrado — vuelve a estar pendiente.');
}

async function agregarAConcentrado(c, reqId){
  const req = State.allReqs.find(r=>r.id===reqId);
  if(!req) return;
  if((c.requisicionIds||[]).includes(reqId)) return;
  const nuevoItem = { id:req.id, empresa:req.empresa, sucursal:req.sucursal, puesto:req.puesto, responsable:req.responsable, items:req.items, observaciones:req.observaciones||'' };
  const nuevoSnapshot = (c.snapshot||[]).concat([nuevoItem]);
  const nuevosIds = (c.requisicionIds||[]).concat([reqId]);
  await Store.updateConcentrado(c.id, Object.assign({}, c, { snapshot:nuevoSnapshot, requisicionIds:nuevosIds }));
  await Store.saveRequisicion(reqId, Object.assign({}, req, { estado:'en_concentrado', concentradoId:c.id, actualizadoEn:new Date().toISOString() }));
  toast('Requisición rezagada agregada al concentrado.');
}

async function toggleLineaComprada(c, lineKey, checked){
  const comprados = Object.assign({}, c.comprados||{});
  if(checked) comprados[lineKey] = true; else delete comprados[lineKey];
  const patch = { comprados };
  // Si ya no queda ninguna línea sin marcar, el concentrado completo pasa a "comprado" automáticamente;
  // si se desmarca alguna, regresa a "pendiente" (salvo que compras lo haya cerrado manualmente y decida reabrirlo aparte).
  const totalLineas = contarLineas(c.snapshot);
  if(Object.keys(comprados).length>=totalLineas && totalLineas>0) patch.estadoCompra = 'comprado';
  else if(c.estadoCompra==='comprado') patch.estadoCompra = 'pendiente';
  await Store.updateConcentrado(c.id, Object.assign({}, c, patch));
}

async function toggleEstadoCompraConcentrado(c){
  if(c.estadoCompra==='comprado'){
    await Store.updateConcentrado(c.id, Object.assign({}, c, { estadoCompra:'pendiente' }));
    toast('Concentrado reabierto — sigue pendiente de compra.');
  } else {
    // marcar todo como comprado de un jalón
    const tree = agrupar(c.snapshot);
    const comprados = {};
    Object.keys(tree).forEach(empresa=> Object.keys(tree[empresa]).forEach(proveedor=> Object.keys(tree[empresa][proveedor]).forEach(rubro=>{
      Object.keys(tree[empresa][proveedor][rubro]).forEach(key=>{ comprados[empresa+'||'+proveedor+'||'+rubro+'||'+key] = true; });
    })));
    await Store.updateConcentrado(c.id, Object.assign({}, c, { estadoCompra:'comprado', comprados }));
    toast('Concentrado marcado como comprado.');
  }
}

function contarLineas(snapshot){
  const tree = agrupar(snapshot);
  let n=0;
  Object.values(tree).forEach(provs=>Object.values(provs).forEach(rubs=>Object.values(rubs).forEach(b=> n+=Object.keys(b).length)));
  return n;
}

function agrupar(snapshot){
  // empresa -> proveedor -> rubro -> producto+unidad -> { cantidad TOTAL, porSucursal:{ "Sucursal (puesto)": cantidad }, responsables:Set }
  // Así compras ve de un vistazo cuánto comprar en total por proveedor, y puede abrir el desglose por sucursal si lo necesita.
  const tree = {};
  snapshot.forEach(r=>{
    (r.items||[]).forEach(it=>{
      const empresa = r.empresa, rubro = it.rubro, proveedor = it.proveedor || 'Sin proveedor asignado';
      tree[empresa] = tree[empresa]||{};
      tree[empresa][proveedor] = tree[empresa][proveedor]||{};
      tree[empresa][proveedor][rubro] = tree[empresa][proveedor][rubro]||{};
      const key = it.producto+'||'+it.unidad;
      const bucket = tree[empresa][proveedor][rubro];
      bucket[key] = bucket[key] || { producto:it.producto, unidad:it.unidad, cantidad:0, porSucursal:{}, responsables:new Set() };
      const cant = Number(it.cantidad)||0;
      bucket[key].cantidad += cant;
      const sucLabel = r.sucursal + (r.puesto ? ' · '+r.puesto : '');
      bucket[key].porSucursal[sucLabel] = (bucket[key].porSucursal[sucLabel]||0) + cant;
      bucket[key].responsables.add(r.responsable);
    });
  });
  return tree;
}

function renderConcentradoDetalle(c){

  const wrap = el('div',{class:'subgroup'},[]);
  const totalLineas = contarLineas(c.snapshot);
  const comprados = c.comprados||{};
  const nCompradas = Object.keys(comprados).length;
  const estaComprado = c.estadoCompra==='comprado';

  const statusChip = estaComprado ? el('span',{class:'chip chip-comprado'},['✔ Comprado']) : el('span',{class:'chip chip-pendiente-compra'},[nCompradas+' / '+totalLineas+' comprado(s)']);
  const statusBtn = el('button',{class: estaComprado ? 'btn btn-ghost' : 'btn btn-primary'},[estaComprado ? 'Reabrir concentrado' : 'Marcar todo como comprado']);
  statusBtn.addEventListener('click', async ()=>{ statusBtn.disabled = true; await toggleEstadoCompraConcentrado(c); });
  wrap.appendChild(el('div',{style:'display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap;'},[statusChip, statusBtn]));

  const btnExcel = el('button',{class:'btn btn-ghost'},['⬇ Descargar Excel']);
  const btnPdf = el('button',{class:'btn btn-ghost'},['⬇ Descargar PDF']);
  btnExcel.addEventListener('click', ()=> exportExcel(tree, c));
  btnPdf.addEventListener('click', ()=> exportPdf(tree, c));
  wrap.appendChild(el('div',{style:'display:flex;gap:10px;margin:0 0 18px;'},[btnExcel, btnPdf]));

  // --- Requisiciones incluidas: permite deshacer una inclusión por error ---
  const reqsBlock = el('div',{class:'card', style:'margin-bottom:16px;background:var(--bg);'},[]);
  reqsBlock.appendChild(el('h4',{style:'margin:0 0 10px;'},['Requisiciones incluidas ('+(c.snapshot||[]).length+')']));
  (c.snapshot||[]).forEach(r=>{
    const quitarBtn = el('button',{class:'btn btn-danger', style:'padding:5px 10px;font-size:12px;'},['Quitar']);
    quitarBtn.addEventListener('click', async ()=>{
      quitarBtn.disabled = true;
      await quitarDeConcentrado(c, r.id);
    });
    reqsBlock.appendChild(el('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;'},[
      el('div',{},[
        el('span',{style:'font-weight:600;'},[r.responsable]),
        el('span',{style:'color:var(--ink-faint);margin-left:6px;'},[`${EMPRESAS[r.empresa].label} · ${r.sucursal} · ${(r.items||[]).length} producto(s)`]),
      ]),
      quitarBtn,
    ]));
  });

  // --- Agregar requisición rezagada (llegó tarde y sigue pendiente) ---
  const pendientesFuera = State.allReqs.filter(r=> r.estado==='enviada' && !(c.requisicionIds||[]).includes(r.id));
  const addBlock = el('div',{style:'display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;'},[]);
  if(pendientesFuera.length===0){
    addBlock.appendChild(el('span',{style:'color:var(--ink-faint);font-size:12.5px;'},['No hay requisiciones pendientes rezagadas por agregar.']));
  } else {
    const sel = el('select',{},[]);
    sel.appendChild(el('option',{value:''},['+ Agregar requisición rezagada…']));
    pendientesFuera.forEach(r=> sel.appendChild(el('option',{value:r.id},[`${r.responsable} · ${EMPRESAS[r.empresa].label} · ${r.sucursal} (${(r.items||[]).length} prod.)`])));
    const addBtn = el('button',{class:'btn btn-ghost'},['Agregar a este concentrado']);
    addBtn.disabled = true;
    sel.addEventListener('change', ()=>{ addBtn.disabled = !sel.value; });
    addBtn.addEventListener('click', async ()=>{
      if(!sel.value) return;
      addBtn.disabled = true;
      await agregarAConcentrado(c, sel.value);
    });
    addBlock.appendChild(sel); addBlock.appendChild(addBtn);
  }
  reqsBlock.appendChild(addBlock);
  wrap.appendChild(reqsBlock);

  const conObs = (c.snapshot||[]).filter(r=> r.observaciones && r.observaciones.trim());
  if(conObs.length){
    const obsDetails = el('details',{class:'groupblock', open:'open', style:'border-color:color-mix(in srgb, var(--gold) 40%, var(--line));'},[]);
    obsDetails.appendChild(el('summary',{},[el('span',{},['📝 Observaciones de los encargados']), el('span',{class:'n'},[conObs.length+' nota(s)'])]));
    const obsInner = el('div',{class:'subgroup'},[]);
    conObs.forEach(r=>{
      obsInner.appendChild(el('div',{class:'obs-note', style:'margin-bottom:8px;'},[
        el('b',{},[`${r.responsable} · ${EMPRESAS[r.empresa].label} · ${r.sucursal}`]),
        r.observaciones,
      ]));
    });
    obsDetails.appendChild(obsInner);
    wrap.appendChild(obsDetails);
  }

  Object.keys(tree).forEach(empresa=>{
    let nItems=0;
    Object.values(tree[empresa]).forEach(rubs=>Object.values(rubs).forEach(b=>nItems+=Object.keys(b).length));
    const details = el('details',{class:'groupblock', open:'open'},[]);
    details.appendChild(el('summary',{},[el('span',{class:'chip '+EMPRESAS[empresa].cls},[EMPRESAS[empresa].label]), el('span',{class:'n'},[nItems+' línea(s) · a comprar por proveedor'])]));
    const inner = el('div',{class:'subgroup'},[]);
    Object.keys(tree[empresa]).forEach(proveedor=>{
      inner.appendChild(el('h4',{},[proveedor]));
      Object.keys(tree[empresa][proveedor]).forEach(rubro=>{
        const bucket = tree[empresa][proveedor][rubro];
        const t = el('table',{},[el('tr',{},[el('th',{style:'width:34px;'},['✓']),el('th',{},[rubro]),el('th',{},['Total a comprar']),el('th',{},['Desglose por sucursal / puesto'])])]);
        Object.entries(bucket).forEach(([bucketKey,row])=>{
          const lineKey = empresa+'||'+proveedor+'||'+rubro+'||'+bucketKey;
          const yaComprado = !!comprados[lineKey];
          const sucursales = Object.keys(row.porSucursal);
          const desglose = el('div',{},[]);
          if(sucursales.length<=1){
            desglose.appendChild(el('span',{style:'color:var(--ink-faint);font-size:12px;'},[sucursales[0]||'—']));
          } else {
            sucursales.forEach(s=>{
              desglose.appendChild(el('div',{style:'font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:10px;padding:1px 0;'},[
                el('span',{},[s]),
                el('span',{class:'mono'},[String(row.porSucursal[s])]),
              ]));
            });
          }
          const cb = el('input',{type:'checkbox', class:'linea-checkbox', title:'Marcar como comprado'});
          cb.checked = yaComprado;
          cb.addEventListener('change', async ()=>{
            cb.disabled = true;
            await toggleLineaComprada(c, lineKey, cb.checked);
          });
          const tr = el('tr',{class: yaComprado ? 'linea-comprada':''},[
            el('td',{},[cb]),
            el('td',{},[el('span',{class:'prod-nombre'},[row.producto]), el('span',{style:'display:block;color:var(--ink-faint);font-size:11px;'},[[...row.responsables].join(', ')])]),
            el('td',{class:'mono', style:'font-size:16px;font-weight:600;white-space:nowrap;'},[String(row.cantidad)+' '+row.unidad]),
            el('td',{},[desglose]),
          ]);
          t.appendChild(tr);
        });
        inner.appendChild(el('div',{class:'tablewrap',style:'margin-bottom:10px;'},[t]));
      });
    });
    details.appendChild(inner);
    wrap.appendChild(details);
  });
  return wrap;
}

function exportExcel(tree, c){
  try{
    const wb = XLSX.utils.book_new();
    const resumen = [['Empresa','Proveedor','Rubro','Producto','Unidad','Cantidad total','Desglose por sucursal / puesto','Pedido por']];
    Object.keys(tree).forEach(empresa=>{
      Object.keys(tree[empresa]).forEach(proveedor=>{
        Object.keys(tree[empresa][proveedor]).forEach(rubro=>{
          Object.values(tree[empresa][proveedor][rubro]).forEach(row=>{
            const desglose = Object.keys(row.porSucursal).map(s=> s+': '+row.porSucursal[s]).join(' · ');
            resumen.push([EMPRESAS[empresa].label, proveedor, rubro, row.producto, row.unidad, row.cantidad, desglose, [...row.responsables].join(', ')]);
          });
        });
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(resumen);
    ws['!cols'] = [{wch:14},{wch:22},{wch:16},{wch:26},{wch:8},{wch:12},{wch:38},{wch:22}];
    XLSX.utils.book_append_sheet(wb, ws, 'Concentrado');

    const obsRows = [['Responsable','Empresa','Sucursal','Observación']];
    (c.snapshot||[]).forEach(r=>{
      if(r.observaciones && r.observaciones.trim()) obsRows.push([r.responsable, EMPRESAS[r.empresa].label, r.sucursal, r.observaciones]);
    });
    if(obsRows.length>1){
      const wsObs = XLSX.utils.aoa_to_sheet(obsRows);
      wsObs['!cols'] = [{wch:20},{wch:14},{wch:16},{wch:60}];
      XLSX.utils.book_append_sheet(wb, wsObs, 'Observaciones');
    }

    const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    Store.saveFile('concentrado_'+todayKey()+'.xlsx', new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))
      .then(()=>toast('Excel guardado.'))
      .catch(err=>toast(err.message||'No se pudo guardar el Excel.'));
  }catch(e){ toast('Error generando Excel: '+e.message); }
}

function exportPdf(tree, c){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14); doc.text('Concentrado de compras', 14, 16);
    doc.setFontSize(9); doc.setTextColor(120); doc.text(fmtDateTime(c.creadoEn), 14, 22);
    let y = 30;
    Object.keys(tree).forEach(empresa=>{
      Object.keys(tree[empresa]).forEach(proveedor=>{
        Object.keys(tree[empresa][proveedor]).forEach(rubro=>{
          const rows = Object.values(tree[empresa][proveedor][rubro]).map(row=>{
            const desglose = Object.keys(row.porSucursal).map(s=> s+': '+row.porSucursal[s]).join('\n');
            return [row.producto, row.cantidad+' '+row.unidad, desglose];
          });
          doc.setFontSize(10); doc.setTextColor(20);
          doc.text(`${EMPRESAS[empresa].label} · ${proveedor} · ${rubro}`, 14, y);
          doc.autoTable({ startY:y+2, head:[['Producto','Total a comprar','Desglose por sucursal / puesto']], body:rows, styles:{fontSize:8}, columnStyles:{2:{cellWidth:90}}, margin:{left:14,right:14}, theme:'grid' });
          y = doc.lastAutoTable.finalY + 10;
          if(y>270){ doc.addPage(); y=20; }
        });
      });
    });
    const obsRows = (c.snapshot||[]).filter(r=>r.observaciones && r.observaciones.trim())
      .map(r=>[r.responsable, EMPRESAS[r.empresa].label+' · '+r.sucursal, r.observaciones]);
    if(obsRows.length){
      if(y>250){ doc.addPage(); y=20; }
      doc.setFontSize(11); doc.setTextColor(20); doc.text('Observaciones de los encargados', 14, y);
      doc.autoTable({ startY:y+3, head:[['Responsable','Sucursal','Observación']], body:obsRows, styles:{fontSize:8}, columnStyles:{2:{cellWidth:110}}, margin:{left:14,right:14}, theme:'grid' });
    }
    const blob = doc.output('blob');
    Store.saveFile('concentrado_'+todayKey()+'.pdf', blob)
      .then(()=>toast('PDF guardado.'))
      .catch(err=>toast(err.message||'No se pudo guardar el PDF.'));
  }catch(e){ toast('Error generando PDF: '+e.message); }
}

function renderCatalogAdmin(){
  const wrap = el('div',{},[]);
  wrap.appendChild(el('p',{style:'color:var(--ink-dim);font-size:13px;margin:0 0 18px;'},['Agrega, edita o elimina productos de cada catálogo. Para editar, cambia el texto y sal del campo (clic afuera o Tab) — se guarda solo. Los cambios se reflejan de inmediato en el formulario de los encargados.']));

  const catalogRefs = [
    ['tacos','Tacos de Anda'],
    ['dantes-barra',"Dante's — Barra (Centro y Boulevard)"],
    ['dantes-cocina',"Dante's — Cocina / producción (Centro y Boulevard)"],
    ['dantes-piso',"Dante's — Piso / limpieza (Centro y Boulevard)"],
    ['dantes-salsas',"Dante's — Insumos para salsas (Chef)"],
    ['inglesa','La Inglesa — cafetería, panadería y repostería'],
  ];

  catalogRefs.forEach(([ref,label])=>{
    const details = el('details',{class:'groupblock'},[]);
    const productos = [];
    const body = el('div',{class:'subgroup'},[]);
    const listWrap = el('div',{},[]);
    details.appendChild(el('summary',{},[label, el('span',{class:'n'},['cargando…'])]));
    details.appendChild(body);
    body.appendChild(listWrap);

    const unsub = Store.watchCatalog(ref, (items)=>{
      details.querySelector('summary .n').textContent = items.length+' producto(s)';
      listWrap.innerHTML='';
      if(items.length===0){
        listWrap.appendChild(el('div',{class:'empty-note'},['Catálogo vacío — el Chef y compras lo llenarán aquí.']));
      } else {
        listWrap.appendChild(el('div',{class:'catalog-admin-row head'},[el('div',{},['Producto']),el('div',{},['Rubro']),el('div',{},['Unidad']),el('div',{},['Proveedor']),el('div',{},[''])]));
        items.forEach(p=>{
          const fNombre = el('input',{type:'text', value:p.nombre});
          const fRubro = el('input',{type:'text', value:p.rubro});
          const fUnidad = el('input',{type:'text', value:p.unidad});
          const fProveedor = el('input',{type:'text', value:p.proveedor||'', placeholder:'—'});

          async function guardarCambio(campo, input, obligatorio){
            const valor = input.value.trim();
            if(obligatorio && !valor){ toast('Este campo no puede quedar vacío.'); input.value = p[campo]; return; }
            if(valor === (p[campo]||'')) return; // sin cambios reales
            const actualizados = items.map(x=> x.id===p.id ? Object.assign({}, x, { [campo]: valor }) : x);
            await Store.saveCatalog(ref, actualizados);
            toast('Producto actualizado.');
          }
          fNombre.addEventListener('change', ()=> guardarCambio('nombre', fNombre, true));
          fRubro.addEventListener('change', ()=> guardarCambio('rubro', fRubro, true));
          fUnidad.addEventListener('change', ()=> guardarCambio('unidad', fUnidad, true));
          fProveedor.addEventListener('change', ()=> guardarCambio('proveedor', fProveedor, false));

          const delBtn = el('button',{class:'del', title:'Eliminar producto'},['✕']);
          delBtn.addEventListener('click', async ()=>{
            if(!confirm('¿Eliminar "'+p.nombre+'" del catálogo?')) return;
            await Store.saveCatalog(ref, items.filter(x=>x.id!==p.id));
            toast('Producto eliminado del catálogo.');
          });

          const row = el('div',{class:'catalog-admin-row'},[
            el('div',{},[fNombre]), el('div',{},[fRubro]), el('div',{},[fUnidad]), el('div',{},[fProveedor]),
            delBtn,
          ]);
          listWrap.appendChild(row);
        });
      }
      productos.length = 0; productos.push(...items);
    });

    const addRubro = el('input',{type:'text', placeholder:'Rubro'});
    const addNombre = el('input',{type:'text', placeholder:'Producto'});
    const addUnidad = el('input',{type:'text', placeholder:'Unidad'});
    const addProveedor = el('input',{type:'text', placeholder:'Proveedor (opcional)'});
    const addBtn = el('button',{class:'btn btn-ghost'},['+ Agregar producto']);
    addBtn.addEventListener('click', async ()=>{
      if(!addRubro.value.trim() || !addNombre.value.trim() || !addUnidad.value.trim()){ toast('Rubro, producto y unidad son obligatorios.'); return; }
      const nuevo = { id:'p'+Date.now()+Math.random().toString(36).slice(2,6), rubro:addRubro.value.trim(), nombre:addNombre.value.trim(), unidad:addUnidad.value.trim(), proveedor:addProveedor.value.trim() };
      await Store.saveCatalog(ref, productos.concat([nuevo]));
      addRubro.value=''; addNombre.value=''; addUnidad.value=''; addProveedor.value='';
      toast('Producto agregado al catálogo.');
    });
    body.appendChild(el('div',{style:'display:grid;grid-template-columns:1fr 1.4fr 0.8fr 1.2fr auto;gap:8px;margin-top:14px;'},[addRubro,addNombre,addUnidad,addProveedor,addBtn]));

    wrap.appendChild(details);
  });

  return wrap;
}

function irAVistaCompras(){
  State.mode = 'compras';
  document.querySelectorAll('#modeSwitch button').forEach(b=> b.classList.toggle('active', b.dataset.mode==='compras'));
  document.getElementById('viewEncargado').hidden = true;
  document.getElementById('viewCompras').hidden = false;
  startCompras();
}

function actualizarBotonAccesoCompras(){
  const btn = document.getElementById('btnAccesoCompras');
  if(btn) btn.hidden = COMPRAS_ACCESS_ENABLED;
}

document.getElementById('modeSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  State.mode = btn.dataset.mode;
  document.querySelectorAll('#modeSwitch button').forEach(b=>b.classList.toggle('active', b===btn));
  document.getElementById('viewEncargado').hidden = State.mode!=='encargado';
  document.getElementById('viewCompras').hidden = State.mode!=='compras';
  if(State.mode==='compras'){ startCompras(); }
  else if(State.mode==='encargado' && !State.identity){ renderOnboard(); }
});

function mostrarModalAccesoCompras(){
  const input = el('input',{type:'password', placeholder:'Código de acceso'});
  input.style.width='100%'; input.style.padding='10px 12px'; input.style.borderRadius='9px';
  input.style.border='1px solid var(--line-strong)'; input.style.background='var(--surface)';
  input.style.color='var(--ink)'; input.style.fontSize='14px'; input.style.fontFamily='inherit';

  const errorMsg = el('div',{style:'color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;'},[]);

  function cerrar(){ overlay.remove(); }
  function intentar(){
    if(input.value.trim() === COMPRAS_ACCESS_TOKEN){
      localStorage.setItem(COMPRAS_ACCESS_KEY, '1');
      COMPRAS_ACCESS_ENABLED = true;
      const btnCompras = document.querySelector('#modeSwitch button[data-mode="compras"]');
      if(btnCompras) btnCompras.hidden = false;
      actualizarBotonAccesoCompras();
      cerrar();
      // Cierra cualquier ventana de "¿Quién eres hoy?" que estuviera abierta y pasa a compras.
      document.getElementById('onboardRoot').innerHTML = '';
      irAVistaCompras();
      toast('Acceso de compras habilitado en este dispositivo.');
    } else {
      errorMsg.textContent = 'Código incorrecto, intenta de nuevo.';
      input.value = '';
      input.focus();
    }
  }

  const entrarBtn = el('button',{class:'btn btn-primary btn-block', style:'margin-top:14px;'},['Entrar']);
  entrarBtn.addEventListener('click', intentar);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') intentar(); });
  const cancelarBtn = el('button',{class:'btn btn-ghost btn-block', style:'margin-top:8px;'},['Cancelar']);
  cancelarBtn.addEventListener('click', cerrar);

  const card = el('div',{class:'onboard-card', style:'max-width:360px;'},[
    el('h2',{style:'font-size:19px;'},['Acceso de compras']),
    el('p',{class:'lead'},['Escribe el código que te compartieron para entrar al panel de compras corporativo.']),
    el('div',{class:'field'},[el('label',{},['Código de acceso']), input]),
    errorMsg,
    entrarBtn,
    cancelarBtn,
  ]);
  const overlay = el('div',{class:'onboard-overlay'},[card]);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cerrar(); });
  document.body.appendChild(overlay);
  input.focus();
}

document.getElementById('btnAccesoCompras').addEventListener('click', mostrarModalAccesoCompras);

(async function(){
  const accesoCompras = habilitarAccesoComprasSiAplica();
  actualizarBotonAccesoCompras();
  await Store.init();
  const yaTieneIdentidadEncargado = !!localStorage.getItem('concentrado_identity');
  if(accesoCompras && !yaTieneIdentidadEncargado){
    // Quien entra con el link de compras y todavía no ha usado la app como encargado
    // va directo al panel de compras, sin que la pantalla "¿Quién eres hoy?" se lo tape.
    irAVistaCompras();
  } else {
    renderOnboard();
  }
})();
